name: daily-digest

# Truly-automated nightly build of 每日情报 (mrqb.space), running in the cloud so it no
# longer depends on Zen's laptop being awake. Generates the issue with Claude Code headless,
# then bin/ci-publish.sh gates it and auto-publishes to prod ONLY if it passes the quality
# self-check (otherwise holds a preview + Telegram pings Zen).

on:
  schedule:
    # Target: 21:00 America/New_York, year-round. GitHub cron is UTC-only, so DST needs two
    # entries — 01:37 UTC is 21:37 EDT (summer), 02:37 UTC is 21:37 EST (winter). Both fire
    # in both seasons; the "already published?" guard below lets only the first one through,
    # so the second is a free retry if the first failed.
    #
    # The :37 is deliberate. On the old '0 1 * * *' every run landed 3-3.5h late (04:00-04:36
    # UTC = ~00:20 NY) — top-of-hour is the most contended slot on shared runners. Off-peak
    # minutes get dispatched far closer to on-time. Cron is still best-effort, not a guarantee.
    - cron: '37 1 * * *'
    - cron: '37 2 * * *'
  workflow_dispatch: {}   # manual "Run workflow" button — used for the first shakedown test

permissions:
  contents: write         # commit the generated issue back to main

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Dedupes the two DST cron entries: whichever fires first builds the issue and commits
      # it to main, so the other checks out a tree that already has it and stops here.
      # A manual dispatch always proceeds, so a rebuild is never blocked.
      - name: Skip if today's issue is already published
        id: guard
        run: |
          DAY="$(TZ=America/New_York date +%F)"
          HOUR="$(TZ=America/New_York date +%H)"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -f "digests/$DAY.json" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "digests/$DAY.json already published — nothing to do."
          elif [ "$HOUR" -ge 12 ] && [ "$HOUR" -lt 21 ]; then
            # Off-season half of the DST pair: 01:37 UTC is 20:37 EST in winter. Never publish
            # before 21:00 NY — the other cron entry covers this season an hour later.
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "it is ${HOUR}:xx in New York, before tonight's 21:00 target — leaving it to the later cron."
          else
            # HOUR >= 21: on-time evening run. HOUR < 12: GitHub dispatched the cron hours
            # late, past NY midnight (observed delays land at 00-01 NY). A plain `< 21` skip
            # here made BOTH entries self-skip every night and froze the site on 08-02/08-03;
            # run anyway and build the new NY day's issue, as the pre-guard nightly always did.
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install tooling (yt-dlp, vercel, claude-code, playwright)
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 -m pip install --quiet --upgrade yt-dlp
          npm install -g vercel @anthropic-ai/claude-code
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate today's issue (Claude Code harness on DeepSeek)
        if: steps.guard.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_FALLBACK_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DAY="$(TZ=America/New_York date +%F)"
          PROMPT="$(cat automation/ci-prompt.txt)"

          # Generation runs on the DeepSeek API via its Anthropic-compatible endpoint
          # (https://api.deepseek.com/anthropic), so the Claude Code harness — tools,
          # subagents, yt-dlp/WebFetch sweeps — is unchanged; only the model behind it
          # moves. Verified 2026-08-20: /anthropic/v1/messages returns real tool_use +
          # thinking blocks and reports usage. Reason for the move: the nightly was the
          # only thing billing the paid Anthropic key, and the Sonnet->Opus->Opus retry
          # ladder made a bad night the most expensive one.
          #
          # The model names stay CLAUDE names on purpose. DeepSeek maps them server-side
          # (claude-sonnet-*/claude-haiku-* -> deepseek-v4-flash, claude-opus-* ->
          # deepseek-v4-pro), so this loop keeps the same cheap-then-strong escalation,
          # the CLI never has to accept a non-Claude --model string, and unsetting
          # ANTHROPIC_BASE_URL below reverts the whole job to real Claude with sane models.
          #
          # Why the ladder escalates instead of re-rolling the cheap model (history worth
          # keeping): on Claude, Sonnet's safeguards tripped on the security-flavoured AI
          # news this sweep keeps surfacing — that killed the 07-31 and 08-01 nightlies
          # outright and flagged twice more on the 08-01 rerun, so re-rolling Sonnet failed
          # the same way on the same content. Whether deepseek-v4-flash declines the same
          # material is UNKNOWN as of the switch — if the logs show attempt 1 refusing
          # night after night, drop claude-sonnet-5 from the loop and start at
          # claude-opus-5 (v4-pro) rather than paying for a doomed first attempt.
          for MODEL in claude-sonnet-5 claude-opus-5 claude-opus-5; do
            if [ -f "digests/$DAY.json" ]; then break; fi
            echo "::group::deepseek generate attempt with $MODEL"
            ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic \
            ANTHROPIC_API_KEY="$DEEPSEEK_API_KEY" \
            ANTHROPIC_AUTH_TOKEN="$DEEPSEEK_API_KEY" \
              claude -p "$PROMPT" --model "$MODEL" --dangerously-skip-permissions || true
            echo "::endgroup::"
          done

          # Safety net, and the reason the nightly does not get less reliable by getting
          # cheaper: if DeepSeek produced nothing at all, spend one real-Anthropic attempt
          # rather than skip the issue. Costs money only on a night that already failed.
          if [ ! -f "digests/$DAY.json" ] && [ -n "$ANTHROPIC_FALLBACK_KEY" ]; then
            echo "::group::anthropic fallback attempt with claude-opus-5"
            ANTHROPIC_API_KEY="$ANTHROPIC_FALLBACK_KEY" \
              claude -p "$PROMPT" --model claude-opus-5 --dangerously-skip-permissions || true
            echo "::endgroup::"
          fi

          test -f "digests/$DAY.json" || echo "generate: no digests/$DAY.json after all attempts"

      - name: Publish (diversity gate + quality check → prod or preview + notify)
        if: steps.guard.outputs.run == 'true'
        env:
          # publicize.mjs calls `claude -p` for the hhxxttxs mirror — same DeepSeek routing
          # as the generate step above (claude-sonnet-5 -> deepseek-v4-flash server-side).
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}  # bin/polish-zh.mjs native-zh rewrite
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: bash bin/ci-publish.sh
