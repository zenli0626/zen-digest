name: daily-digest

# Truly-automated nightly build of 每日情报 (mrqb.space), running in the cloud so it no
# longer depends on Zen's laptop being awake. Generates the issue with Claude Code headless,
# then bin/ci-publish.sh gates it and auto-publishes to prod ONLY if it passes the quality
# self-check (otherwise holds a preview + Telegram pings Zen).

on:
  schedule:
    # 01:00 UTC ≈ 21:00 America/New_York (EDT). Drifts ~1h across DST; GitHub cron is UTC-only
    # and best-effort (can lag under load). Fine for a nightly.
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # manual "Run workflow" button — used for the first shakedown test

permissions:
  contents: write         # commit the generated issue back to main

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling (yt-dlp, vercel, claude-code, playwright)
        run: |
          python3 -m pip install --quiet --upgrade yt-dlp
          npm install -g vercel @anthropic-ai/claude-code
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate today's issue (Claude Code, headless)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DAY="$(TZ=America/New_York date +%F)"
          # Retry across models. Sonnet goes first for cost, but its safeguards trip on the
          # security-flavoured AI news this sweep keeps surfacing — that killed the 07-31 and
          # 08-01 nightlies outright, and flagged twice more on the 08-01 rerun. So escalate
          # to Opus instead of re-rolling Sonnet, which fails the same way on the same content.
          for MODEL in claude-sonnet-5 claude-opus-5 claude-opus-5; do
            if [ -f "digests/$DAY.json" ]; then break; fi
            echo "::group::generate attempt with $MODEL"
            claude -p "$(cat automation/ci-prompt.txt)" --model "$MODEL" --dangerously-skip-permissions || true
            echo "::endgroup::"
          done
          test -f "digests/$DAY.json" || echo "generate: no digests/$DAY.json after all attempts"

      - name: Publish (diversity gate + quality check → prod or preview + notify)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # publicize.mjs calls `claude -p` for the hhxxttxs mirror
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}  # bin/polish-zh.mjs native-zh rewrite
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: bash bin/ci-publish.sh
